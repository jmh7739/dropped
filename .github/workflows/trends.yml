name: 실시간 인기·트렌드 상품 자동 갱신

on:
  schedule:
    # 매시간 수집하고, UTC 0/4/8/12/16/20시에는 관련 상품도 함께 갱신한다.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 실행할 갱신 작업
        required: true
        default: all
        type: choice
        options:
          - all
          - realtime
          - products

concurrency:
  group: dropped-trends
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dropped-trend-bot/package-lock.json

      - name: Install trend worker
        working-directory: dropped-trend-bot
        run: npm ci

      - name: Install headless Chromium
        working-directory: dropped-trend-bot
        run: npx playwright install --with-deps chromium

      - name: Collect and publish trends
        working-directory: dropped-trend-bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_MODE: ${{ inputs.mode || '' }}
        shell: bash
        run: |
          if [ -n "$REQUESTED_MODE" ]; then
            MODE="$REQUESTED_MODE"
          elif [ $((10#$(date -u +%H) % 4)) -eq 0 ]; then
            MODE="all"
          else
            MODE="realtime"
          fi
          echo "Dropped trend mode: $MODE"
          node src/worker.js "$MODE"
