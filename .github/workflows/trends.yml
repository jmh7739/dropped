name: 실시간 인기·트렌드 상품 자동 갱신

on:
  schedule:
    # GitHub Actions는 정각보다 지연될 수 있어 혼잡한 정각을 피해서 4시간마다 실행.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: dropped-trends
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dropped-trend-bot/package-lock.json

      - name: Install trend worker
        working-directory: dropped-trend-bot
        run: npm ci

      - name: Install headless Chromium
        working-directory: dropped-trend-bot
        run: npx playwright install --with-deps chromium

      - name: Collect and publish trends
        working-directory: dropped-trend-bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/worker.js all
