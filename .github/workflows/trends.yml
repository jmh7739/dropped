name: 실시간 인기·트렌드 상품 자동 갱신

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 실행할 갱신 작업
        required: true
        default: all
        type: choice
        options:
          - all
          - realtime
          - products

concurrency:
  group: dropped-trends
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dropped-trend-bot/package-lock.json

      - name: Install trend worker
        working-directory: dropped-trend-bot
        run: npm ci

      - name: Install headless Chromium
        working-directory: dropped-trend-bot
        run: npx playwright install --with-deps chromium

      - name: Collect and publish trends
        working-directory: dropped-trend-bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TREND_MODE: ${{ inputs.mode || 'all' }}
        run: node src/worker.js "$TREND_MODE"
