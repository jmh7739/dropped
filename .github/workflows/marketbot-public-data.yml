name: MarketBot approved public data snapshots

on:
  schedule:
    - cron: '40 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Limit a manual verification to one source; scheduled runs remain all'
        type: choice
        options: [all, lotte, cu, homeplus, coverage]
        default: all
  push:
    paths:
      - marketbot-collectors/collect_public_data.py
      - marketbot-collectors/collect_retail_promotions.py
      - marketbot-collectors/collect_more_retail.py
      - marketbot-collectors/retail_official_price_rules.json
      - marketbot-collectors/test_retail_promotions.py
      - marketbot-collectors/merge_retail_catalogs.py
      - .github/workflows/marketbot-public-data.yml

permissions:
  contents: write

concurrency:
  group: marketbot-public-data
  cancel-in-progress: false

jobs:
  retail-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retailer parsers and safety rules
        run: python -m unittest discover -s marketbot-collectors -p test_retail_promotions.py
      - name: Collect and second-check public retailer observations
        run: python marketbot-collectors/collect_retail_promotions.py --retailer "${{ inputs.retailer || 'all' }}"
      - name: Publish observed retailer history
        if: success() || failure()
        run: |
          set -euo pipefail
          cp marketbot-data/retail-promotions.json "$RUNNER_TEMP/collected-retail-promotions.json"
          for attempt in 1 2 3; do
            git fetch origin main
            # This is the job's disposable checkout, and this file is its only
            # generated change. Keep observations before switching to latest main.
            git restore -- marketbot-data/retail-promotions.json
            git switch -C marketbot-retail-publish origin/main
            python marketbot-collectors/merge_retail_catalogs.py "$RUNNER_TEMP/collected-retail-promotions.json" marketbot-data/retail-promotions.json
            git add marketbot-data/retail-promotions.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name='MarketBot' -c user.email='marketbot@users.noreply.github.com' commit -m 'Refresh verified retailer observations'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Could not publish retailer observations after three attempts' >&2
          exit 1
  collect:
    if: github.event_name != 'workflow_dispatch' || inputs.retailer == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public metadata
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python marketbot-collectors/collect_public_data.py
      - name: Publish verified snapshots
        if: always()
        run: |
          set -euo pipefail
          if ! test -f marketbot-data/public-feed.json; then
            echo 'No verified public feed to publish'
            exit 0
          fi
          cp marketbot-data/public-feed.json "$RUNNER_TEMP/collected-public-feed.json"
          for attempt in 1 2 3; do
            # Workflows share main. Start each attempt from the newest committed
            # snapshot and merge groups by checkedAt before pushing.
            git fetch origin main
            git reset --hard origin/main
            python marketbot-collectors/merge_public_feed.py \
              "$RUNNER_TEMP/collected-public-feed.json" marketbot-data/public-feed.json
            git add marketbot-data/public-feed.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name='MarketBot' -c user.email='marketbot@users.noreply.github.com' \
              commit -m 'Refresh approved public data snapshots'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Could not publish public data after three attempts' >&2
          exit 1
