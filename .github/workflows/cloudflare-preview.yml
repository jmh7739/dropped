name: Rebuild Dropped Cloudflare preview

on:
  schedule:
    - cron: '57 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dropped-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-20261105
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/static-edge/edge.test.mjs
      - name: Rebuild and publish the preview
        run: bash scripts/static-edge/deploy-preview.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://dropped.kr
      - name: Check public preview
        run: |
          headers=$(curl -fsSI --max-time 20 https://hotdeal-curation.jmh7739.workers.dev/store-deals)
          grep -qi '^x-robots-tag: noindex, nofollow' <<< "$headers"
          grep -qi '^HTTP/.* 200 ' <<< "$headers"
