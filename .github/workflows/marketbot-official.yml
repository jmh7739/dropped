name: MarketBot official source snapshots

on:
  schedule:
    - cron: '25 0,12 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - marketbot-collectors/collect_official.py
      - marketbot-collectors/merge_official_snapshots.py
      - marketbot-collectors/test_merge_official_snapshots.py
      - .github/workflows/marketbot-official.yml

permissions:
  contents: write

concurrency:
  group: marketbot-official-sources
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s marketbot-collectors -p test_merge_official_snapshots.py
      - run: python marketbot-collectors/collect_official.py
      - name: Publish changed source snapshots
        run: |
          set -euo pipefail
          cp -R marketbot-data "$RUNNER_TEMP/official-observations"
          for attempt in 1 2 3; do
            git fetch origin main
            # This Actions checkout is disposable. Reapply only owned files
            # to latest main, comparing per-source verification timestamps.
            git reset --hard origin/main
            python marketbot-collectors/merge_official_snapshots.py \
              "$RUNNER_TEMP/official-observations" marketbot-data
            git add marketbot-data/checked-at.json marketbot-data/seoul-culture.xml marketbot-data/qnet-*.html
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name='MarketBot' -c user.email='marketbot@users.noreply.github.com' commit -m 'Refresh official source snapshots'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Could not publish official snapshots after three attempts' >&2
          exit 1
      - name: Publish new travel news
        run: curl --fail --show-error --silent --retry 2 --max-time 40 --request POST https://tripmkt.kr/api/updates/refresh
      - name: Refresh jobs and official exam dates
        run: |
          curl --fail --show-error --silent --retry 2 --max-time 90 \
            https://jobmarket.kr/api/catalog/wake -o wake.json
          jq -e '.ok == true and (.qnet.issues | length == 0) and
            ([.sources[] | select(.state == "error")] | length == 0)' wake.json >/dev/null || {
            jq '{checkedAt, sourceErrors: [.sources[] | select(.state == "error") | {id, state, message}], examIssues: .qnet.issues}' wake.json
            exit 1
          }
