<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Dropped Link Helper
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 16px;

      background: #0b1422;
      color: #eef4ff;

      font-family:
        Arial,
        sans-serif;
    }

    h2 {
      margin:
        0
        0
        6px;

      font-size: 19px;
    }

    p {
      color: #9dacbf;

      font-size: 12px;

      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 150px;

      margin-top: 8px;

      padding: 9px;

      resize: vertical;

      border-radius: 8px;

      border:
        1px solid
        #293e5c;

      background: #07101b;

      color: #e9f0fb;

      font-size: 11px;
    }

    input {
      width: 100%; margin-top: 8px; padding: 9px; border-radius: 8px;
      border: 1px solid #293e5c; background: #07101b; color: #e9f0fb; font-size: 11px;
    }

    button {
      width: 100%;

      min-height: 38px;

      margin-top: 8px;

      border: 0;

      border-radius: 8px;

      background: #5d61df;

      color: white;

      cursor: pointer;

      font-weight: 700;
    }

    button.secondary {
      background: #17263b;

      color: #c2d0e2;
    }

    #status {
      margin-top: 12px;

      padding: 10px;

      min-height: 42px;

      border-radius: 8px;

      background: #07101b;

      color: #aebed2;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 11px;

      line-height: 1.5;
    }
  </style>

</head>

<body>

  <h2>
    Dropped Link Helper
  </h2>

  <p>
    Trend Finder에서 복사된 상품 목록을 불러와
    현재 쿠팡 파트너스 간편링크 화면에서 처리합니다.
  </p>

  <textarea
    id="queueInput"
    placeholder="Trend Finder에서 복사한 상품 목록을 여기에 붙여넣으세요."
  ></textarea>

  <input id="endpointInput" value="https://dropped.kr/api/affiliate-queue" aria-label="Dropped queue API 주소">
  <input id="tokenInput" type="password" placeholder="DROPPED_WORKER_TOKEN" aria-label="Worker token">

  <button id="loadButton" class="secondary">
    Dropped에서 대기열 불러오기
  </button>

  <button id="pasteButton">
    클립보드에서 가져오기
  </button>

  <button id="startButton">
    현재 상품 링크 생성
  </button>

  <button id="autoButton">
    전체 자동 생성
  </button>

  <button
    id="nextButton"
    class="secondary"
  >
    다음 상품 생성
  </button>

  <button
    id="copyButton"
    class="secondary"
  >
    결과 JSON 복사
  </button>

  <div id="status">
    대기 중
  </div>

  <script src="./popup.js"></script>

</body>
</html>
